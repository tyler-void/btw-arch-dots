# markdown-resume: the static Nuxt build. Reached only through the Cloudflare tunnel;
# the container publishes no host port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # `expires` below does not count as add_header, so these stay on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/index.html $uri.html /200.html;
    }

    # Nuxt's hashed build output (buildAssetsDir: 'assets'): safe to cache for good.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # The PWA service worker and manifest must be revalidated, or updates never arrive.
    location ~ ^/(sw[^/]*\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        expires epoch;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
