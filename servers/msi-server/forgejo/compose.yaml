# Forgejo for tyler: https://git.tyler-void.dev through a Cloudflare Tunnel,
# git over SSH on the Tailscale IP only. How to run, back up and restore: README.md
name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15       # LTS line; `docker compose pull` stays on 15.x
    container_name: forgejo
    restart: unless-stopped
    env_file:
      - forgejo.env                              # SECRET_KEY, INTERNAL_TOKEN, JWT secrets (mode 600)
    environment:
      USER_UID: "1000"                           # = thai on the host, so data/ and dumps/ need no sudo
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: git.tyler-void.dev
      FORGEJO__server__ROOT_URL: https://git.tyler-void.dev/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: msi-server.tail5cea38.ts.net
      FORGEJO__server__SSH_PORT: "2222"          # what clone URLs show; the container's sshd listens on 22
      FORGEJO__security__INSTALL_LOCK: "true"    # no web installer: the tunnel makes this public
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"      # public repos readable without an account
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      FORGEJO__mailer__ENABLED: "false"          # no outgoing mail
      FORGEJO__ui__THEMES: enhalation,forgejo-auto,forgejo-light,forgejo-dark,gitea-auto,gitea-light,gitea-dark
      FORGEJO__ui__DEFAULT_THEME: enhalation     # visitors; each account picks its own in Settings → Appearance
    volumes:
      - ./data:/data
      - ./dumps:/dumps                           # outside /data, so a dump never contains older dumps
      - ./custom/public:/data/gitea/public:ro    # theme-enhalation.css, generated by btw-arch-dots scripts/gen-theme.py
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "100.86.47.42:2222:22"                   # git over SSH, Tailscale only. No HTTP port: web goes through the tunnel
    networks: [forgejo]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: forgejo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - cloudflared.env                          # TUNNEL_TOKEN (mode 600)
    depends_on: [forgejo]
    networks: [forgejo]

networks:
  forgejo:
